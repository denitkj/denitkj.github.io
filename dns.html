<!DOCTYPE html>
<html lang="id" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deni Tools | DNS & Repo Automator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            violet: '#8b5cf6',
                            blue: '#3b82f6',
                            dark: '#020617',
                            slate: '#1e293b',
                            debian: '#d70a53'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .premium-gradient {
            background: linear-gradient(135deg, #d70a53 0%, #8b5cf6 100%);
        }
        .code-screen {
            background: #0d1117;
            border-radius: 1.25rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .btn-interact:active { transform: scale(0.96); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white dark:bg-brand-dark text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="fixed top-0 w-full z-50 px-4 py-4 md:px-8">
        <nav class="max-w-7xl mx-auto glass rounded-2xl p-3 flex justify-between items-center shadow-lg border border-white/20">
            <div class="flex items-center gap-3 pl-2">
                <div class="w-10 h-10 premium-gradient rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i data-lucide="zap" class="w-6 h-6"></i>
                </div>
                <div class="flex flex-col leading-none">
                    <span class="text-xl font-extrabold tracking-tighter uppercase">Debian.Script</span>
                    <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">AIO DNS & Repo Tool</span>
                </div>
            </div>

            <button id="theme-toggle" class="w-10 h-10 rounded-xl glass flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-yellow-400"></i>
                <i data-lucide="moon" class="w-5 h-5 dark:hidden text-brand-violet"></i>
            </button>
        </nav>
    </header>

    <main class="flex-grow pt-28 md:pt-36 pb-20 px-4 md:px-8 max-w-7xl mx-auto w-full">
        
        <!-- Input Section -->
        <div class="mb-12" data-aos="fade-down">
            <div class="glass p-8 rounded-[2.5rem] shadow-2xl border-t-4 border-brand-debian relative overflow-hidden">
                <div class="absolute top-0 right-0 w-64 h-64 bg-brand-debian/5 rounded-full -mr-32 -mt-32 blur-3xl"></div>
                
                <div class="flex flex-col md:flex-row items-end gap-6 relative z-10">
                    <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-1">Nama Domain</label>
                            <div class="relative">
                                <i data-lucide="globe" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                                <input type="text" id="domainInput" value="contoh.local" 
                                    class="w-full pl-12 pr-4 py-4 bg-slate-100 dark:bg-slate-900/50 border border-transparent focus:border-brand-debian/50 rounded-2xl outline-none transition-all font-bold text-lg">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-1">IP Address Server</label>
                            <div class="relative">
                                <i data-lucide="server" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                                <input type="text" id="ipInput" value="192.168.20.2" 
                                    class="w-full pl-12 pr-4 py-4 bg-slate-100 dark:bg-slate-900/50 border border-transparent focus:border-brand-debian/50 rounded-2xl outline-none transition-all font-bold text-lg">
                            </div>
                        </div>
                    </div>
                    <button onclick="generateAll()" class="w-full md:w-auto px-10 py-4 premium-gradient text-white rounded-2xl font-black shadow-xl shadow-brand-debian/30 btn-interact transition-all flex items-center justify-center gap-3 min-w-[200px]">
                        <i data-lucide="wand-2" class="w-6 h-6"></i> GENERATE SCRIPT
                    </button>
                </div>
            </div>
        </div>

        <!-- Output Sections -->
        <div id="resultsContainer" class="hidden grid lg:grid-cols-2 gap-8">
            
            <!-- Step 1 Card -->
            <div class="space-y-4" data-aos="fade-right">
                <div class="flex items-center justify-between px-2">
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-lg premium-gradient flex items-center justify-center text-white font-black text-sm shadow-md">1</span>
                        <h3 class="font-bold uppercase tracking-widest text-xs text-slate-500">Update & Repositori</h3>
                    </div>
                    <button onclick="copyCode('output1', 'copyBtn1')" id="copyBtn1" class="text-[10px] font-black text-brand-debian hover:text-brand-violet transition-colors flex items-center gap-1 uppercase tracking-tighter">
                        <i data-lucide="copy" class="w-3 h-3"></i> Salin Kode
                    </button>
                </div>
                <div class="glass p-1 rounded-[2rem] shadow-xl">
                    <textarea id="output1" readonly class="w-full h-[450px] p-6 code-screen text-emerald-400 font-mono text-xs leading-relaxed outline-none resize-none no-scrollbar"></textarea>
                </div>
            </div>

            <!-- Step 2 Card -->
            <div class="space-y-4" data-aos="fade-left">
                <div class="flex items-center justify-between px-2">
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-lg bg-slate-800 dark:bg-slate-700 flex items-center justify-center text-white font-black text-sm shadow-md border border-white/10">2</span>
                        <h3 class="font-bold uppercase tracking-widest text-xs text-slate-500">Konfigurasi DNS Bind9</h3>
                    </div>
                    <button onclick="copyCode('output2', 'copyBtn2')" id="copyBtn2" class="text-[10px] font-black text-blue-500 hover:text-blue-400 transition-colors flex items-center gap-1 uppercase tracking-tighter">
                        <i data-lucide="copy" class="w-3 h-3"></i> Salin Kode
                    </button>
                </div>
                <div class="glass p-1 rounded-[2rem] shadow-xl">
                    <textarea id="output2" readonly class="w-full h-[450px] p-6 code-screen text-blue-300 font-mono text-xs leading-relaxed outline-none resize-none no-scrollbar"></textarea>
                </div>
            </div>

        </div>

        <!-- Initial Placeholder -->
        <div id="placeholder" class="py-20 text-center" data-aos="zoom-in">
            <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-3xl flex items-center justify-center mx-auto mb-6">
                <i data-lucide="code-2" class="w-10 h-10 text-slate-400"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-400">Masukkan parameter di atas untuk memulai</h3>
            <p class="text-slate-500 text-sm mt-2 max-w-md mx-auto italic">Skrip akan otomatis menyesuaikan zone reverse DNS berdasarkan oktet IP Address Anda.</p>
        </div>

    </main>

    <footer class="mt-auto py-12 px-4 border-t border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 opacity-60">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 premium-gradient rounded flex items-center justify-center text-[10px] text-white font-black shadow-sm italic">D</div>
                <span class="text-[10px] font-black uppercase tracking-[0.4em]">© 2024 Deni.Net Studio</span>
            </div>
            <div class="flex gap-6 text-[10px] font-black uppercase tracking-[0.2em]">
                <a href="#" class="hover:text-brand-debian">Dokumentasi</a>
                <a href="#" class="hover:text-brand-debian">Server Guide</a>
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();
        AOS.init({ duration: 800, once: true });

        function generateAll() {
            const domain = document.getElementById('domainInput').value.trim() || 'contoh.local';
            const ip = document.getElementById('ipInput').value.trim() || '192.168.20.2';
            
            const ipParts = ip.split('.');
            if(ipParts.length !== 4) {
                alert("Format IP tidak valid!");
                return;
            }
            const lastOctet = ipParts[3];
            const reverseZoneBase = `${ipParts[2]}.${ipParts[1]}.${ipParts[0]}`;

            const script1 = `# --- STEP 1: REPOSITORY & UPDATE ---
cat <<EOF > /etc/apt/sources.list
deb http://deb.debian.org/debian bullseye main contrib non-free
deb-src http://deb.debian.org/debian bullseye main contrib non-free

deb http://deb.debian.org/debian-security/ bullseye-security main contrib non-free
deb-src http://deb.debian.org/debian-security/ bullseye-security main contrib non-free

deb http://deb.debian.org/debian bullseye-updates main contrib non-free
deb-src http://deb.debian.org/debian bullseye-updates main contrib non-free
EOF

apt update && apt upgrade -y
apt install bind9 dnsutils -y`;

            // STEP 2 CONTENT
            const script2 = `
cd /etc/bind
cp db.127 db.reverse
cp db.local db.forward

cat <<EOF > /etc/bind/db.forward
; BIND data file for ${domain}
\\$TTL    604800
@       IN      SOA     ${domain}. root.${domain}. (
                              2         ; Serial
                         604800         ; Refresh
                          86400         ; Retry
                        2419200         ; Expire
                         604800 )       ; Negative Cache TTL
;
@       IN      NS      ${domain}.
@       IN      A       ${ip}
www     IN      A       ${ip}
EOF

cat <<EOF > /etc/bind/db.reverse
; BIND reverse data file for ${domain}
\\$TTL    604800
@       IN      SOA     ${domain}. root.${domain}. (
                              1         ; Serial
                         604800         ; Refresh
                          86400         ; Retry
                        2419200         ; Expire
                         604800 )       ; Negative Cache TTL
;
@       IN      NS      ${domain}.
${lastOctet}       IN      PTR     ${domain}.
EOF

cat <<EOF >> /etc/bind/named.conf.default-zones

zone "${domain}" {
    type master;
    file "/etc/bind/db.forward";
};

zone "${reverseZoneBase}.in-addr.arpa" {
    type master;
    file "/etc/bind/db.reverse";
};
EOF

echo "nameserver ${ip}" > /etc/resolv.conf

systemctl restart bind9
echo "--- Verifikasi ---"
nslookup ${domain}
nslookup www.${domain}`;

            document.getElementById('output1').value = script1;
            document.getElementById('output2').value = script2;
            
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');
            
            // Re-animate
            AOS.refresh();
        }

        function copyCode(targetId, btnId) {
            const el = document.getElementById(targetId);
            if(!el.value) return;
            
            el.select();
            document.execCommand('copy');
            
            const btn = document.getElementById(btnId);
            const original = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> TERSALIN!`;
            btn.classList.add('text-emerald-500');
            lucide.createIcons();
            
            setTimeout(() => {
                btn.innerHTML = original;
                btn.classList.remove('text-emerald-500');
                lucide.createIcons();
            }, 2000);
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });
    </script>
</body>
</html>
