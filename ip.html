                                <div class="grid md:grid-cols-2 gap-4">

                            <input type="text" id="blockTarget" placeholder="deni.com" class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border-2 border-transparent focus:border-brand-violet transition-all outline-none font-bold">

                        <button onclick="generateBlockScript()" class="w-full py-4 bg-slate-900 dark:bg-white text-white dark:text-brand-dark font-black rounded-2xl shadow-xl btn-interact transition-all uppercase tracking-widest text-xs">
                            Generate Blocker Script

                    </div>

            </div>

            <!-- Main Output Area -->
            <div class="lg:col-span-7 space-y-6">
                <div class="glass p-6 md:p-8 rounded-[2.5rem] flex flex-col h-full shadow-2xl relative min-h-[500px]" data-aos="fade-left">
                    
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center gap-3">
                            <div class="flex gap-1.5">
                                <div class="w-3 h-3 rounded-full bg-red-500/50"></div>
                                <div class="w-3 h-3 rounded-full bg-yellow-500/50"></div>

                            </div>

                        </div>
                        
                        <div class="flex items-center gap-2">
                            <button onclick="undo()" title="Histori Sebelumnya" class="p-2.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-slate-500 hover:text-brand-violet transition-all btn-interact">
                                <i data-lucide="undo-2" class="w-5 h-5"></i>
                            </button>
                            <button onclick="copyOutput()" id="copyBtn" class="flex items-center gap-2 px-5 py-2.5 premium-gradient text-white rounded-xl text-xs font-black shadow-lg btn-interact transition-all">

                    </div>

                    <div class="relative flex-grow">
                        <textarea id="mainOutput" readonly class="w-full h-full min-h-[350px] p-6 code-screen text-emerald-400 font-mono text-sm leading-relaxed outline-none resize-none no-scrollbar" placeholder="# Klik generate untuk melihat script..."></textarea>
                    </div>

    <!-- Footer -->
    <footer class="mt-auto bg-slate-50/50 dark:bg-brand-dark/50 border-t border-slate-200 dark:border-slate-800 py-12 px-4 md:px-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex flex-col items-center md:items-start gap-2">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 premium-gradient rounded-lg flex items-center justify-center text-white font-black italic shadow-md">D</div>
                    <span class="text-lg font-black tracking-tighter italic uppercase text-slate-800 dark:text-white">DENI.ENGINEER</span>

    <script>
        // Init
        lucide.createIcons();
        AOS.init({ duration: 800, once: true });

        // Interfaces setup
        const ifaces = ['ether1', 'ether2', 'ether3', 'ether4', 'ether5', 'wlan1', 'wlan2'];
        const ifaceGrid = document.getElementById('iface-grid');
        
        ifaces.forEach(iface => {
            const container = document.createElement('div');
            container.className = 'relative';
            container.innerHTML = `
                <input type="checkbox" name="iface" value="${iface}" class="iface-checkbox hidden" id="chk-${iface}">
                <label for="chk-${iface}" class="block p-2 text-[10px] font-black border-2 border-slate-200 dark:border-slate-800 rounded-lg text-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition-all uppercase truncate">${iface}</label>
            `;
            ifaceGrid.appendChild(container);
        });

        // App Logic
        let currentProtocol = 'http';
        let history = [];
        const outputField = document.getElementById('mainOutput');

        function pushHistory(text) {
            if(text && text !== history[history.length - 1]) {
                history.push(text);
                if(history.length > 30) history.shift();
            }
            outputField.value = text;
        }

        function undo() {
            if(history.length > 1) {
                history.pop();
                outputField.value = history[history.length - 1];
            } else if(history.length === 1) {
                history.pop();
                outputField.value = '';
            }
        }

        function setProtocol(p) {
            currentProtocol = p;
            const btnHttp = document.getElementById('btnHttp');
            const btnHttps = document.getElementById('btnHttps');
            const adminGroup = document.getElementById('adminGroup');
            
            if(p === 'http') {
                btnHttp.className = 'flex-1 py-3 text-xs font-black rounded-xl transition-all bg-white dark:bg-slate-800 shadow-sm text-brand-violet uppercase';
                btnHttps.className = 'flex-1 py-3 text-xs font-black rounded-xl transition-all text-slate-500 uppercase';
                adminGroup.style.display = 'block';
            } else {
                btnHttps.className = 'flex-1 py-3 text-xs font-black rounded-xl transition-all bg-white dark:bg-slate-800 shadow-sm text-brand-violet uppercase';
                btnHttp.className = 'flex-1 py-3 text-xs font-black rounded-xl transition-all text-slate-500 uppercase';
                adminGroup.style.display = 'none';
            }
        }

        function calculateIpBlock() {
            const ipBase = document.getElementById('calcIp').value || '192.168.4.0';
            const cidr = parseInt(document.getElementById('calcCidr').value);
            const blockNum = parseInt(document.getElementById('blockIdx').value) || 1;
            const resDiv = document.getElementById('calcResult');
            
            const ipParts = ipBase.split('.');
            if(ipParts.length !== 4) return alert('Format IP tidak valid');

            const blockSize = Math.pow(2, (32 - cidr));
            const startFourthOctet = (blockNum - 1) * blockSize;
            
            if(startFourthOctet > 255) return alert('Blok ke-' + blockNum + ' melebihi batas oktet subnet /' + cidr);

            const netAddr = `${ipParts[0]}.${ipParts[1]}.${ipParts[2]}.${startFourthOctet}`;
            const gateway = `${ipParts[0]}.${ipParts[1]}.${ipParts[2]}.${startFourthOctet + 1}`;
            const firstIP = gateway;
            const subnetMask = cidrToSubnetMask(cidr);
            const lastIP = `${ipParts[0]}.${ipParts[1]}.${ipParts[2]}.${startFourthOctet + blockSize - 2}`;
            const broadcast = `${ipParts[0]}.${ipParts[1]}.${ipParts[2]}.${startFourthOctet + blockSize - 1}`;

            resDiv.classList.remove('hidden');
resDiv.innerHTML = `
<div class="space-y-3">
    <p class="text-[10px] font-black text-brand-violet uppercase">
        Hasil Blok Ke-${blockNum} (/${cidr})
    </p>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <p class="text-[9px] font-bold text-slate-400 uppercase">Network</p>
            <p class="font-mono text-sm font-bold">${netAddr}</p>
        </div>
        <div>
            <p class="text-[9px] font-bold text-slate-400 uppercase">Broadcast</p>
            <p class="font-mono text-sm font-bold">${broadcast}</p>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <p class="text-[9px] font-bold text-slate-400 uppercase">Gateway</p>
            <p class="font-mono text-sm font-bold text-emerald-500">${gateway}</p>
        </div>
        <div>
            <p class="text-[9px] font-bold text-slate-400 uppercase">Subnet Mask</p>
            <p class="font-mono text-sm font-bold">${subnetMask}</p>
        </div>
    </div>

    <p class="text-[9px] font-bold text-slate-400 uppercase">Range Usable Host</p>
    <p class="font-mono text-xs font-bold text-brand-violet">
        ${firstIP} — ${lastIP}
    </p>
</div>
`;

            const script = `# IP CALCULATION: BLOK ${blockNum}\n# Net: ${netAddr}/${cidr}\n# Host: ${firstIP}-${lastIP}\n# Broad: ${broadcast}\n\n/ip address add address=${netAddr}/${cidr} interface=ether1 comment="Subnet_Block_${blockNum}"`;
            document.getElementById('mainOutput').value = script;
        }

function generateBlockScript() {
    const target = document.getElementById('blockTarget').value || 'detik.com';
    const admin = document.getElementById('adminName').value || 'deni';
    const selectedIfaces = Array.from(
        document.querySelectorAll('input[name="iface"]:checked')
    ).map(i => i.value);

    let script = `# MIKROTIK SCRIPT BY DENI\n`;
    script += `# Target: ${target}\n`;
    script += `# Date: ${new Date().toLocaleDateString()}\n\n`;

    /* ==================================
       MODE HTTP (Web Proxy & Redirect)
       ================================== */
    if (currentProtocol === 'http') {
        script += `# 1. Aktifkan Web Proxy\n`;
        script += `/ip proxy set enabled=yes port=8080 cache-administrator="${admin}" anonymous=yes\n`;
        
        script += `# 2. Aturan Blokir Proxy\n`;
        script += `/ip proxy access add dst-host="*${target}*" action=deny comment="Block_${target}"\n\n`;

        script += `# 3. Redirect Port 80 ke Proxy\n`;
        if (selectedIfaces.length > 0) {
            selectedIfaces.forEach(iface => {
                script += `/ip firewall nat add chain=dstnat protocol=tcp dst-port=80 in-interface="${iface}" action=redirect to-ports=8080 comment="Redirect_${iface}"\n`;
            });
        } else {
            script += `/ip firewall nat add chain=dstnat protocol=tcp dst-port=80 action=redirect to-ports=8080 comment="Global_Redirect_HTTP"\n`;
        }
    } 

    /* ==================================
       MODE HTTPS (TLS-Host / Layer 7)
       ================================== */
    else {
        script += `# Menghapus rule lama agar tidak duplikat\n`;
        script += `/ip firewall filter remove [find comment="Block_HTTPS_${target}"]\n\n`;

        script += `# Blokir HTTPS menggunakan TLS-HOST (Lebih Akurat dari L7)\n`;
        if (selectedIfaces.length > 0) {
            selectedIfaces.forEach(iface => {
                script += `/ip firewall filter add chain=forward protocol=tcp dst-port=443 in-interface="${iface}" tls-host="*${target}*" action=drop comment="Block_HTTPS_${target}"\n`;
            });
        } else {
            script += `/ip firewall filter add chain=forward protocol=tcp dst-port=443 tls-host="*${target}*" action=drop comment="Block_HTTPS_${target}"\n`;
        }
    }

    pushHistory(script);
}


        function copyOutput() {
            const area = document.getElementById('mainOutput');
            if(!area.value) return;
            area.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copyBtn');
            const original = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> BERHASIL!`;
            btn.classList.replace('premium-gradient', 'bg-emerald-500');
            lucide.createIcons();
            setTimeout(() => {
                btn.innerHTML = original;
                btn.classList.replace('bg-emerald-500', 'premium-gradient');
                lucide.createIcons();
            }, 2000);
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        function cidrToSubnetMask(cidr) {
    let mask = [];
    for (let i = 0; i < 4; i++) {
        let bits = Math.min(cidr, 8);
        mask.push(256 - Math.pow(2, 8 - bits));
        cidr -= bits;
    }
    return mask.join('.');
}
    </script>
</body>
