<!DOCTYPE html>
<html lang="id" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deni Tools | MikroTik Scripting & Network</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            violet: '#8b5cf6',
                            blue: '#3b82f6',
                            dark: '#020617',
                            slate: '#1e293b'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .premium-gradient {
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
        }
        .code-screen {
            background: #0d1117;
            border-radius: 1.5rem;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .iface-checkbox:checked + label {
            background: #8b5cf6;
            color: white;
            border-color: #8b5cf6;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-interact:active { transform: scale(0.96); }
        .btn-interact:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-white dark:bg-brand-dark text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="fixed top-0 w-full z-50 px-4 py-4 md:px-8">
        <nav class="max-w-7xl mx-auto glass rounded-2xl p-3 md:p-4 flex justify-between items-center shadow-lg shadow-black/5">
            <div class="flex items-center gap-2 md:gap-3 pl-2">
                <div class="w-10 h-10 premium-gradient rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                </div>
                <div class="flex flex-col leading-none">
                    <span class="text-xl font-extrabold tracking-tighter uppercase">Deni.Net</span>
                    <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">Network Engineer</span>
                </div>
            </div>

            <div class="flex items-center gap-2 md:gap-4">
                <button id="theme-toggle" class="w-10 h-10 rounded-xl glass flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                </button>
            </div>
        </nav>
    </header>

    <!-- Content -->
    <main class="flex-grow pt-28 md:pt-36 pb-12 px-4 md:px-8 max-w-7xl mx-auto w-full">
        
        <div class="grid lg:grid-cols-12 gap-8">
            
            <!-- Sidebar Controls -->
            <div class="lg:col-span-5 space-y-6">
                
                <div class="grid md:grid-cols-2 gap-4">
                    <a href="https://mikrotik.com/download" target="_blank" class="glass p-6 rounded-3xl flex items-center justify-between group hover:border-brand-blue/50 transition-all border-l-4 border-brand-blue">
                        <div>
                            <h4 class="font-bold text-slate-900 dark:text-white">Download Winbox</h4>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Versi Terbaru</p>
                        </div>
                        <i data-lucide="download" class="w-6 h-6 text-brand-blue group-hover:scale-110 transition-transform"></i>
                    </a>
                    <div class="glass p-6 rounded-3xl flex items-center justify-between group hover:border-brand-violet/50 transition-all border-l-4 border-brand-violet cursor-pointer">
                        <div>
                            <h4 class="font-bold text-slate-900 dark:text-white">Hotspot Pro</h4>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Template Login</p>
                        </div>
                        <i data-lucide="layout" class="w-6 h-6 text-brand-violet group-hover:scale-110 transition-transform"></i>
                    </div>
                </div>

                <!-- Blocker Card -->
                <section class="glass p-6 md:p-8 rounded-[2.5rem] shadow-xl" data-aos="fade-right">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 bg-red-500/10 text-red-500 rounded-2xl flex items-center justify-center">
                            <i data-lucide="shield-alert" class="w-6 h-6"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold tracking-tight">Advanced Blocker</h2>
                    </div>

                    <div class="space-y-4">
                        <div class="flex p-1.5 bg-slate-100 dark:bg-slate-900/50 rounded-2xl">
                            <button onclick="setProtocol('http')" id="btnHttp" class="flex-1 py-3 text-xs font-black rounded-xl transition-all bg-white dark:bg-slate-800 shadow-sm text-brand-violet uppercase">HTTP Proxy</button>
                            <button onclick="setProtocol('https')" id="btnHttps" class="flex-1 py-3 text-xs font-black rounded-xl transition-all text-slate-500 uppercase">HTTPS + Layer7</button>
                        </div>

                        <div id="adminGroup">
                            <label class="text-[10px] font-bold uppercase text-slate-400 tracking-[0.2em] mb-2 block">Cache Administrator</label>
                            <input type="text" id="adminName" value="deni" class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border-2 border-transparent focus:border-brand-violet transition-all outline-none font-bold">
                        </div>
                        
                        <div>
                            <label class="text-[10px] font-bold uppercase text-slate-400 tracking-[0.2em] mb-2 block">Domain Target</label>
                            <input type="text" id="blockTarget" placeholder="detik.com" class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border-2 border-transparent focus:border-brand-violet transition-all outline-none font-bold">
                        </div>

                        <!-- Multi-Interface Selection -->
                        <div>
                            <label class="text-[10px] font-bold uppercase text-slate-400 tracking-[0.2em] mb-3 block">Pilih In-Interface</label>
                            <div class="grid grid-cols-4 gap-2" id="iface-grid">
                                <!-- JS Injection -->
                            </div>
                        </div>

                        <button onclick="generateBlockScript()" class="w-full py-4 premium-gradient text-white font-black rounded-2xl shadow-xl btn-interact transition-all uppercase tracking-widest text-xs">
                            Generate Script
                        </button>
                    </div>
                </section>

                <!-- IP Calc Card -->
                <section class="glass p-6 md:p-8 rounded-[2.5rem] shadow-xl" data-aos="fade-right">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 bg-brand-violet/10 text-brand-violet rounded-2xl flex items-center justify-center">
                            <i data-lucide="binary" class="w-6 h-6"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold tracking-tight">IP Calculator</h2>
                    </div>
                    <div class="space-y-4">
                        <input type="text" id="calcIp" placeholder="192.168.1.0" class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border-2 border-transparent focus:border-brand-violet outline-none font-bold">
                        <div class="grid grid-cols-2 gap-4">
                            <select id="calcCidr" class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border-2 border-transparent focus:border-brand-violet outline-none font-bold">
                                <option value="24">/24</option>
                                <option value="25">/25</option>
                                <option value="26">/26</option>
                                <option value="27">/27</option>
                                <option value="28">/28</option>
                            </select>
                            <input type="number" id="blockIdx" value="1" min="1" class="w-full p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border-2 border-transparent focus:border-brand-violet outline-none font-bold">
                        </div>
                        <button onclick="calculateIpBlock()" class="w-full py-4 bg-slate-900 dark:bg-white text-white dark:text-brand-dark font-black rounded-2xl btn-interact uppercase tracking-widest text-xs">Hitung Range</button>
                    </div>
                    <div id="calcResult" class="mt-4 hidden p-4 rounded-2xl bg-brand-violet/5 border-l-4 border-brand-violet"></div>
                </section>
            </div>

            <!-- Main Output Area -->
            <div class="lg:col-span-7 space-y-6">
                <div class="glass p-6 md:p-8 rounded-[2.5rem] flex flex-col h-full shadow-2xl relative min-h-[500px]" data-aos="fade-left">
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center gap-3">
                            <div class="flex gap-1.5">
                                <div class="w-3 h-3 rounded-full bg-red-500/50"></div>
                                <div class="w-3 h-3 rounded-full bg-yellow-500/50"></div>
                                <div class="w-3 h-3 rounded-full bg-green-500/50"></div>
                            </div>
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] ml-2">Terminal Output</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="copyOutput()" id="copyBtn" class="flex items-center gap-2 px-5 py-2.5 premium-gradient text-white rounded-xl text-xs font-black shadow-lg btn-interact transition-all">
                                <i data-lucide="copy" class="w-4 h-4"></i> SALIN SCRIPT
                            </button>
                        </div>
                    </div>

                    <div class="relative flex-grow">
                        <textarea id="mainOutput" readonly class="w-full h-full min-h-[400px] p-6 code-screen text-emerald-400 font-mono text-sm leading-relaxed outline-none resize-none no-scrollbar" placeholder="# Script akan muncul di sini..."></textarea>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        AOS.init({ duration: 800, once: true });

        const ifaces = ['ether1', 'ether2', 'ether3', 'ether4', 'ether5', 'wlan1', 'wlan2'];
        const ifaceGrid = document.getElementById('iface-grid');
        
        ifaces.forEach(iface => {
            const container = document.createElement('div');
            container.className = 'relative';
            container.innerHTML = `
                <input type="checkbox" name="iface" value="${iface}" class="iface-checkbox hidden" id="chk-${iface}">
                <label for="chk-${iface}" class="block p-2 text-[10px] font-black border-2 border-slate-200 dark:border-slate-800 rounded-lg text-center cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition-all uppercase truncate">${iface}</label>
            `;
            ifaceGrid.appendChild(container);
        });

        let currentProtocol = 'http';
        const outputField = document.getElementById('mainOutput');

        function setProtocol(p) {
            currentProtocol = p;
            const btnHttp = document.getElementById('btnHttp');
            const btnHttps = document.getElementById('btnHttps');
            const adminGroup = document.getElementById('adminGroup');
            
            if(p === 'http') {
                btnHttp.className = 'flex-1 py-3 text-xs font-black rounded-xl transition-all bg-white dark:bg-slate-800 shadow-sm text-brand-violet uppercase';
                btnHttps.className = 'flex-1 py-3 text-xs font-black rounded-xl transition-all text-slate-500 uppercase';
                adminGroup.style.display = 'block';
            } else {
                btnHttps.className = 'flex-1 py-3 text-xs font-black rounded-xl transition-all bg-white dark:bg-slate-800 shadow-sm text-brand-violet uppercase';
                btnHttp.className = 'flex-1 py-3 text-xs font-black rounded-xl transition-all text-slate-500 uppercase';
                adminGroup.style.display = 'none';
            }
        }

        function generateBlockScript() {
            const target = document.getElementById('blockTarget').value || 'detik.com';
            const admin = document.getElementById('adminName').value || 'deni';
            const selectedIfaces = Array.from(document.querySelectorAll('input[name="iface"]:checked')).map(i => i.value);
            
            // Nama regex aman untuk Layer 7 MikroTik
            const safeName = target.replace(/[^a-zA-Z0-9]/g, '_');

            let script = `# ==========================================\n`;
            script += `# MIKROTIK SCRIPT GENERATOR BY DENI.ENGINEER\n`;
            script += `# Target: ${target}\n`;
            script += `# Mode: ${currentProtocol.toUpperCase()}\n`;
            script += `# ==========================================\n\n`;

            if (currentProtocol === 'http') {
                script += `/ip proxy set enabled=yes port=8080 cache-administrator=${admin} anonymous=yes\n`;
                script += `/ip proxy access add dst-host=${target} action=deny comment="Blokir ${target}"\n\n`;

                if (selectedIfaces.length > 0) {
                    selectedIfaces.forEach(iface => {
                        script += `/ip firewall nat add chain=dstnat protocol=tcp dst-port=80 in-interface=${iface} action=redirect to-ports=8080 comment="Redirect HTTP ${iface}"\n`;
                    });
                } else {
                    script += `/ip firewall nat add chain=dstnat protocol=tcp dst-port=80 action=redirect to-ports=8080 comment="Global HTTP Redirect"\n`;
                }
            } else {
                // HTTPS + Layer 7 Protocol Logic
                script += `# 1. Menambahkan Layer 7 Protocol\n`;
                script += `/ip firewall layer7-protocol add name="${safeName}_L7" regexp="^.+( ${target}).*\\\$"\n\n`;
                
                script += `# 2. Menambahkan Filter Rules (Content + L7)\n`;
                if (selectedIfaces.length > 0) {
                    selectedIfaces.forEach(iface => {
                        script += `/ip firewall filter add chain=forward protocol=tcp in-interface=${iface} content="${target}" layer7-protocol="${safeName}_L7" action=drop comment="${target} on ${iface} (L7+Content)"\n`;
                    });
                } else {
                    script += `/ip firewall filter add chain=forward protocol=tcp content="${target}" layer7-protocol="${safeName}_L7" action=drop comment="Global Block ${target} (L7+Content)"\n`;
                }
            }

            outputField.value = script;
        }

        function calculateIpBlock() {
            const ipBase = document.getElementById('calcIp').value || '192.168.1.0';
            const cidr = parseInt(document.getElementById('calcCidr').value);
            const blockNum = parseInt(document.getElementById('blockIdx').value) || 1;
            const resDiv = document.getElementById('calcResult');
            
            const ipParts = ipBase.split('.');
            if(ipParts.length !== 4) return;

            const blockSize = Math.pow(2, (32 - cidr));
            const start = (blockNum - 1) * blockSize;
            
            if(start > 255) {
                resDiv.innerHTML = "Blok melebihi kapasitas oktet.";
                resDiv.classList.remove('hidden');
                return;
            }

            const net = `${ipParts[0]}.${ipParts[1]}.${ipParts[2]}.${start}`;
            const gw = `${ipParts[0]}.${ipParts[1]}.${ipParts[2]}.${start + 1}`;
            const end = `${ipParts[0]}.${ipParts[1]}.${ipParts[2]}.${start + blockSize - 2}`;
            const broad = `${ipParts[0]}.${ipParts[1]}.${ipParts[2]}.${start + blockSize - 1}`;

            resDiv.classList.remove('hidden');
            resDiv.innerHTML = `
                <div class="text-[10px] font-bold space-y-1">
                    <p class="text-brand-violet uppercase">Blok ${blockNum} (/${cidr})</p>
                    <p>Network: ${net}</p>
                    <p>Gateway: ${gw}</p>
                    <p>Broadcast: ${broad}</p>
                    <p class="text-emerald-500">Range: ${gw} - ${end}</p>
                </div>
            `;
            
            outputField.value = `/ip address add address=${net}/${cidr} interface=ether1 comment="Subnet_Blok_${blockNum}"`;
        }

        function copyOutput() {
            const area = document.getElementById('mainOutput');
            if(!area.value) return;
            area.select();
            document.execCommand('copy');
            const btn = document.getElementById('copyBtn');
            const original = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> DISALIN!`;
            setTimeout(() => { btn.innerHTML = original; lucide.createIcons(); }, 2000);
            lucide.createIcons();
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });
    </script>
</body>
</html>
